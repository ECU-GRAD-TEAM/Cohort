[project]
name = "cohort-student-ai"
version = "0.1.0"
description = "Python AI orchestration service for Cohort's student assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.4",
    "python-dotenv>=1.0.1,<2.0.0",
    "google-genai>=2.3.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
]

[project.optional-dependencies]
playground = [
    "streamlit>=1.42.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "playground*"]

[tool.pytest.ini_options]
pythonpath = ["."]